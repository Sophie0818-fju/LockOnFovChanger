; LockOnFovChanger external configuration
; Read once when the Lua mod loads. Restart the game after editing.

; Normal in-game FOV is 90, LockOnFOV is the FOV value after locked on enemy.
; Set to 70 to zoom in and set to 120 to zoom out.

; LockOnOffsetZ raises the Lock-On camera height / look-down angle.
; 0 is close to the game default. Higher values look more top-down.

; PageDown disables FOV, Y offset, and LockOnOffsetZ modifications.
; PageUp restores the configured modifications.

FOVEnabled=true
LockOnFOV=110
LockOnOffsetZ=60
CameraOffsetFix=true
EnableLog=false
